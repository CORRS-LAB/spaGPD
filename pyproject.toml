[project]
name = "spagpd"
version = "1.0.0"
description = "spaGPD: spatial graph-guided cell-type proportion deconvolution for spatial transcriptomics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anndata>=0.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "networkx>=3.1",
    "numpy>=1.24,<3",
    "pandas>=1.5,<3",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "torch>=2.0",
]

[project.scripts]
spagpd = "spagpd.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spagpd"]

[project.optional-dependencies]
test = [
    "pytest>=7",
]
